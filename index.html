<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>皮克敏蘑菇計時器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">PIKMIN BLOOM</p>
        <h1>蘑菇完成日期計算器</h1>
        <p class="subtitle">輸入目前正在挑戰的蘑菇，完成時間會自動計算並即時倒數。</p>
      </header>

      <section class="card" aria-labelledby="add-title">
        <div class="section-heading">
          <h2 id="add-title">新增挑戰</h2>
          <p>新增當下會自動記為開始時間。</p>
        </div>
        <form id="mushroom-form" class="entry-form">
          <label>使用者<input id="user" name="user" maxlength="40" required placeholder="例如：小明" /></label>
          <label>菇菇名稱<input id="mushroom" name="mushroom" maxlength="60" required placeholder="例如：巨大紅菇" /></label>
          <label>總戰力<input id="power" name="power" type="number" min="0" step="1" required placeholder="例如：12500" /></label>
          <label>剩餘時間（日:時:分:秒）<input id="duration" name="duration" required inputmode="numeric" pattern="\d+:\d{1,2}:\d{1,2}:\d{1,2}" placeholder="例如：1:02:30:00" title="格式為 日:時:分:秒，例如 1:02:30:00" /></label>
          <button type="submit" class="primary">新增蘑菇</button>
        </form>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </section>

      <section class="card list-card" aria-labelledby="list-title">
        <div class="section-heading list-heading">
          <div><h2 id="list-title">進行中的蘑菇</h2><p id="count-label">0 筆資料</p></div>
          <div class="list-tools"><label class="search-label">搜尋使用者<input id="name-search" type="search" placeholder="輸入使用者名稱" /></label><button id="clear-finished" type="button" class="secondary">清除已結束</button></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>操作</th><th>使用者</th><th>菇菇名稱</th><th>總戰力</th><th>開始時間</th><th>剩餘時間</th><th>結束日期</th></tr></thead>
            <tbody id="mushroom-list"></tbody>
          </table>
        </div>
        <p id="empty-state" class="empty-state">尚未新增蘑菇。從上方開始記錄吧！</p>
      </section>
    </main>

    <dialog id="edit-dialog">
      <form id="edit-form" class="edit-form">
        <div class="dialog-heading"><h2>修改蘑菇</h2><button type="button" id="close-dialog" class="icon-button" aria-label="關閉">×</button></div>
        <label>使用者<input id="edit-user" required maxlength="40" /></label>
        <label>菇菇名稱<input id="edit-mushroom" required maxlength="60" /></label>
        <label>總戰力<input id="edit-power" type="number" min="0" step="1" required /></label>
        <label>開始時間<input id="edit-start" type="datetime-local" required /></label>
        <label>剩餘時間（日:時:分:秒）<input id="edit-duration" required placeholder="0:01:00:00" /></label>
        <p id="edit-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button type="button" id="cancel-edit" class="secondary">取消</button><button class="primary">儲存修改</button></div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
