<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>皮克敏蘑菇計時器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">PIKMIN BLOOM</p>
        <h1>蘑菇完成日期計算器</h1>
        <p class="subtitle">輸入目前正在挑戰的蘑菇，完成時間會自動計算並即時倒數。</p>
      </header>

      <section class="card target-card" aria-labelledby="target-title">
        <div class="section-heading">
          <h2 id="target-title">目標時間倒數</h2>
          <p>設定目標年月日時分，查看距離目標還有多久。</p>
        </div>
        <div class="target-tools">
          <label>目標時間（年月日時分）<input id="target-time" type="datetime-local" /></label>
          <p id="target-countdown" class="target-countdown" aria-live="polite">請輸入目標時間</p>
        </div>
      </section>

      <section class="card" aria-labelledby="add-title">
        <div class="section-heading">
          <h2 id="add-title">新增挑戰</h2>
          <p>新增當下會自動記為開始時間。</p>
        </div>
        <form id="mushroom-form" class="entry-form">
          <label>常用人員<select id="common-user" name="common-user"><option value="">請選擇使用者</option></select></label>
          <label>使用者<input id="user" name="user" maxlength="40" required placeholder="例如：小明" /></label>
          <label>菇菇尺寸<select id="mushroom-size" name="mushroom-size"><option value="">請選擇尺寸</option><option value="小">小</option><option value="一般">一般</option><option value="大">大</option><option value="巨大">巨大</option></select></label>
          <label>菇菇種類<select id="mushroom-type" name="mushroom-type"><option value="">請選擇種類</option><option value="活動菇">活動菇</option><option value="紅菇">紅菇</option><option value="黃菇">黃菇</option><option value="藍菇">藍菇</option><option value="紫菇">紫菇</option><option value="白菇">白菇</option><option value="粉菇">粉菇</option><option value="灰菇">灰菇</option><option value="冰藍菇">冰藍菇</option><option value="火蘑菇">火蘑菇</option><option value="水蘑菇">水蘑菇</option><option value="電蘑菇">電蘑菇</option><option value="毒蘑菇">毒蘑菇</option><option value="水晶蘑菇">水晶蘑菇</option></select></label>
          <label>菇菇名稱<input id="mushroom" name="mushroom" maxlength="60" required placeholder="例如：巨大紅菇" /></label>
          <label>總戰力<input id="power" name="power" type="number" min="0" step="1" required placeholder="例如：12500" /></label>
          <label>剩餘時間（日:時:分:秒）<input id="duration" name="duration" required inputmode="numeric" pattern="\d+:\d{1,2}:\d{1,2}:\d{1,2}" placeholder="例如：1:02:30:00" title="格式為 日:時:分:秒，例如 1:02:30:00" /></label>
          <label>預計完成時間（年月日時分秒）<output id="completion-preview" class="completion-preview" aria-live="polite">請輸入剩餘時間</output></label>
          <button type="submit" class="primary">新增蘑菇</button>
        </form>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </section>

      <section class="card list-card" aria-labelledby="list-title">
        <div class="section-heading list-heading">
          <div><h2 id="list-title">進行中的蘑菇</h2><p id="count-label">0 筆資料</p></div>
          <div class="list-tools"><label class="search-label">搜尋使用者<input id="name-search" type="search" placeholder="輸入使用者名稱" /></label><button id="history-toggle" type="button" class="secondary">查看歷史資料</button><button id="clear-finished" type="button" class="secondary">清除已結束</button></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>操作</th><th aria-sort="none"><button type="button" class="sort-button" data-sort="user">使用者 <span>↕</span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="mushroom">菇菇名稱 <span>↕</span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="power">總戰力 <span>↕</span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="startAt">開始時間 <span>↕</span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="remaining">剩餘時間 <span>↕</span></button></th><th aria-sort="none"><button type="button" class="sort-button" data-sort="endAt">結束日期 <span>↕</span></button></th></tr></thead>
            <tbody id="mushroom-list"></tbody>
          </table>
        </div>
        <p id="empty-state" class="empty-state">尚未新增蘑菇。從上方開始記錄吧！</p>
      </section>
      <p id="sync-status" class="sync-status" role="status">正在連線至共用資料庫…</p>
    </main>

    <dialog id="edit-dialog">
      <form id="edit-form" class="edit-form">
        <div class="dialog-heading"><h2>修改蘑菇</h2><button type="button" id="close-dialog" class="icon-button" aria-label="關閉">×</button></div>
        <label>使用者<input id="edit-user" required maxlength="40" /></label>
        <label>菇菇名稱<input id="edit-mushroom" required maxlength="60" /></label>
        <label>總戰力<input id="edit-power" type="number" min="0" step="1" required /></label>
        <label>開始時間<input id="edit-start" type="datetime-local" required /></label>
        <label>剩餘時間（日:時:分:秒）<input id="edit-duration" required placeholder="0:01:00:00" /></label>
        <p id="edit-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button type="button" id="cancel-edit" class="secondary">取消</button><button class="primary">儲存修改</button></div>
      </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
